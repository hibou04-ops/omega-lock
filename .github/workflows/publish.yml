name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish omega-lock
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build backend
        run: python -m pip install --upgrade build twine

      - name: Verify version
        run: |
          # version-agnostic: derive from pyproject, assert __init__ + release tag agree
          PKG_VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $PKG_VER"
          grep "\"$PKG_VER\"" src/omega_lock/__init__.py
          if [ -n "${GITHUB_REF_NAME:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "release tag: $GITHUB_REF_NAME"
            [ "$GITHUB_REF_NAME" = "v$PKG_VER" ] || { echo "tag $GITHUB_REF_NAME != v$PKG_VER"; exit 1; }
          fi
          echo "PKG_VER=$PKG_VER" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pip install -e ".[dev]" && python -m pytest tests

      - name: Build package
        run: |
          rm -rf dist build *.egg-info src/*.egg-info
          python -m build

      - name: Check package
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Publish readiness gate
        run: python scripts/publish_readiness.py --intended-version "$PKG_VER" --offline

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
